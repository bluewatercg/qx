[custom]
; ACL4SSR custom profile for r2s-miller / Nikki
; Based on ACL4SSR_Online_MultiCountry.ini
; Keep group names aligned with the current cfsub subscription.
; Only the Lisa protocol group uses url-test; all Cloudflare-heavy groups remain manual
; to avoid unnecessary health checks and request quota consumption.
;
; Group count is deliberately minimal: every group here owns a real decision.
; Rulesets point straight at the deciding group instead of through a wrapper alias,
; so adding a ruleset never means adding a group.
ruleset=🎯 全球直连,https://raw.githubusercontent.com/bluewatercg/qx/main/rules/nikki-direct.list
ruleset=☑️ 手动切换,https://raw.githubusercontent.com/bluewatercg/qx/main/rules/nikki-download.list
ruleset=F0-丽莎组,https://raw.githubusercontent.com/bluewatercg/qx/main/rules/nikki-restricted.list
ruleset=📹 油管视频,https://raw.githubusercontent.com/bluewatercg/qx/main/rules/nikki-media.list
ruleset=📲 电报信息,https://raw.githubusercontent.com/bluewatercg/qx/main/rules/nikki-chat.list
ruleset=🤖 OpenAi,https://raw.githubusercontent.com/bluewatercg/qx/main/rules/nikki-ai.list

