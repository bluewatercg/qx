; Manual-first groups. The current subscription supplies the actual nodes.
; ☑️ 手动切换 is the single main knob: default traffic, downloads, media, Apple,
; Google-CN and PlayStore all follow it.
custom_proxy_group=☑️ 手动切换`select`.*
; F0-丽莎组 picks the lower-latency of Lisa's two Hysteria2 ports every 5 min.
custom_proxy_group=F0-丽莎组`url-test`(F0-丽莎-(AnyTLS|HY2-UDP443|HY2-14369|Reality|anytls|hy2-udp443|hy2|reality))$`https://www.gstatic.com/generate_204`300,,100
; 🤖 OpenAi is pinned to Lisa for IP reputation (no PTR, fraud score 7 vs DediRock 38),
; not for speed. Never let it follow the main knob.
custom_proxy_group=🤖 OpenAi`select`[]F0-丽莎组`[]☑️ 手动切换`[]DIRECT`.*
custom_proxy_group=📹 油管视频`select`[]☑️ 手动切换`[]F0-丽莎组`[]DIRECT`.*
custom_proxy_group=📲 电报信息`select`[]☑️ 手动切换`[]F0-丽莎组`[]DIRECT`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]☑️ 手动切换
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]☑️ 手动切换`[]F0-丽莎组`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true
