; ACL4SSR custom profile for phones only: two decisions, AI and YouTube.
; Companion to ACL4SSR_Nikki.ini (router profile, five business groups). Keep them
; separate: do not merge, and do not point the router at this file.
;
; Design:
;   - Every rule either picks the AI group, the YouTube group, or goes DIRECT.
;   - Both groups default to the shared url-test pool, so a dead Lisa protocol
;     falls over automatically instead of stranding the phone.
;   - No download / media / Telegram / Microsoft / Apple groups: phones do not
;     need a per-site selector, and fewer groups means fewer taps.
;
; Rulesets are fetched from qx at runtime, so rule edits still ship from there.

ruleset=🎯 直连,https://raw.githubusercontent.com/bluewatercg/qx/main/rules/nikki-direct.list
ruleset=🤖 AI,https://raw.githubusercontent.com/bluewatercg/qx/main/rules/nikki-ai.list
ruleset=📹 油管,https://raw.githubusercontent.com/bluewatercg/qx/main/rules/nikki-media-chat.list

ruleset=🎯 直连,https://raw.githubusercontent.com/cmliu/ACL4SSR/refs/heads/main/Clash/CFnat.list
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🛑 拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🧹 净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=[],[]GEOIP,CN
ruleset=🐟 兜底,[]FINAL

; The pool. url-test keeps the fastest of the four Lisa protocols.
; 180 s interval: the phone is battery-sensitive and gstatic 204 checks are cheap.
custom_proxy_group=🎬 观看`url-test`(F0-丽莎-(AnyTLS|HY2-UDP443|HY2-14369|Reality|anytls|hy2-udp443|hy2|reality))$`https://www.gstatic.com/generate_204`180,,100

; Only two user-facing choices on the phone.
custom_proxy_group=🤖 AI`select`[]🎬 观看`[]DIRECT`(openai|chatgpt|anthropic|claude|gemini|generativelanguage|aistudio|perplexity|mistral|groq|openrouter|huggingface|replicate|cohere|copilot|deepseek|grok|x\.ai|github|githubusercontent|cursor|windsurf|codeium|zed\.dev|nvidia|anyrouter|shuaiapi|freebuff)
custom_proxy_group=📹 油管`select`[]🎬 观看`[]DIRECT`(youtube|googlevideo|ytimg|youtube-nocookie)

; Fixed groups, not user choices.
custom_proxy_group=🎯 直连`select`[]DIRECT`[]🎬 观看
custom_proxy_group=🛑 拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🧹 净化`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 兜底`select`[]🎬 观看`[]🎯 直连

; Real-DNS bypass for JD. Fake-IP hands the app a 198.18.x.x address that its
; TLS pinning / IP echo rejects, so the image CDN and some API calls render
; blank. These three suffixes must resolve through upstream DNS instead.
; Mihomo spelling is +.domain (glob *.domain is not accepted here).
fake_ip_filter=+.jd.com
fake_ip_filter=+.360buyimg.com
fake_ip_filter=+.jd.hk

enable_rule_generator=true
overwrite_original_rules=true
